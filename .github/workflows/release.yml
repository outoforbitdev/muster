name: Release

permissions: read-all

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect:
    permissions:
      contents: write
    # yamllint disable-line rule:line-length
    uses: outoforbitdev/reusable-workflows-library/.github/workflows/detect-new-changelog-version.yml@ffb7fcc6d8418595d18543d55c62a2ade1388ae9 # v1.4.1

  build:
    needs: detect
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'

      - name: Create release tag
        env:
          VERSION: ${{ needs.detect.outputs.new-version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Run GoReleaser (build only)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --skip=publish,announce

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.should-release == 'true'
    permissions:
      contents: write
    # yamllint disable-line rule:line-length
    uses: outoforbitdev/reusable-workflows-library/.github/workflows/publish-release.yml@ffb7fcc6d8418595d18543d55c62a2ade1388ae9 # v1.4.1
    with:
      version: ${{ needs.detect.outputs.new-version }}
      prerelease: ${{ needs.detect.outputs.is-prerelease == 'true' }}
      release-notes: ${{ needs.detect.outputs.release-notes }}
      draft: false
      artifact-name: release-artifacts

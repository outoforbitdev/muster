name: Release

permissions: read-all

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect:
    permissions:
      contents: write
    # yamllint disable-line rule:line-length
    uses: outoforbitdev/reusable-workflows-library/.github/workflows/detect-new-changelog-version.yml@b674d318217d98c503fe511058762fb93b0f96d2 # v1.5.2

  build:
    needs: detect
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'

      - name: Create release tag
        env:
          VERSION: ${{ needs.detect.outputs.new-version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Run GoReleaser (build only)
        # yamllint disable-line rule:line-length
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --clean --skip=publish,announce

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.should-release == 'true'
    permissions:
      contents: write
    # yamllint disable-line rule:line-length
    uses: outoforbitdev/reusable-workflows-library/.github/workflows/publish-release.yml@fb57c9f8cd050cb02fd18b1d28e0fc23e8550a7a # v1.5.1
    with:
      version: ${{ needs.detect.outputs.new-version }}
      prerelease: ${{ needs.detect.outputs.is-prerelease == 'true' }}
      release-notes: ${{ needs.detect.outputs.release-notes }}
      draft: false
      artifact-name: release-artifacts
